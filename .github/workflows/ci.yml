name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && 'pr' || 'run' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dependencies: [locked, lower]
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - if: matrix.dependencies == 'lower'
        run: npm install --no-save agentic-identity@0.10.0 agentic-design@0.8.0
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:account-package
      - name: dev smoke
        run: node scripts/dev-vars.mjs && node scripts/dev-smoke.mjs 8792 /health

  ui:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dependencies: [locked, lower]
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - if: matrix.dependencies == 'lower'
        run: npm install --no-save agentic-identity@0.10.0 agentic-design@0.8.0
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:ui
